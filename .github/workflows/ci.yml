name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-pr:
    name: Conventional pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Validate title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            printf 'Pull request titles must use Conventional Commits.\n'
            printf 'Examples: feat: add filters | fix(scanner): skip empty files | feat!: change the data format\n'
            exit 1
          fi

  scanner:
    name: Scanner and shell checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck

      - name: Lint shell scripts
        run: shellcheck generate-library.sh scripts/*.sh tests/*.sh

      - name: Test the library generator
        run: ./tests/test-generator.sh

  native:
    name: Native / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-2025
            platform: windows
            arch: x64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - label: macOS Apple Silicon
            runner: macos-15
            platform: macos
            arch: arm64
          - label: macOS Intel
            runner: macos-15-intel
            platform: macos
            arch: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux webview headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build optimized native app
        run: cargo build --locked --release

      - name: Verify portable Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-binary.ps1

      - name: Package smoke-test artifact
        shell: bash
        run: ./scripts/package-release.sh ci "${{ matrix.platform }}" "${{ matrix.arch }}"

      - name: Upload native artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deckshelf-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
