name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install validation and cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64-posix \
            gcc-mingw-w64-x86-64-posix \
            shellcheck

      - name: Check formatting and modules
        run: |
          test -z "$(gofmt -l .)"
          go mod verify

      - name: Lint shell scripts
        run: shellcheck generate-library.sh scripts/*.sh tests/*.sh

      - name: Test generator
        run: ./tests/test-generator.sh

      - name: Build native Windows app
        env:
          VERSION: ci-${{ github.sha }}
        run: ./scripts/build-windows.sh

      - name: Verify native runtime dependencies
        run: ./scripts/verify-windows-binary.sh

      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rom-shelf-windows-x64
          path: dist/ROM Shelf.exe
          if-no-files-found: error
          retention-days: 14

