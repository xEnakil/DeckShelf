name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install validation and cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64-posix \
            gcc-mingw-w64-x86-64-posix \
            shellcheck \
            zip

      - name: Resolve release version
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          git rev-parse --verify "refs/tags/$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Validate source
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          shellcheck generate-library.sh scripts/*.sh tests/*.sh
          ./tests/test-generator.sh

      - name: Build and verify native app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/build-windows.sh
          ./scripts/verify-windows-binary.sh

      - name: Package portable release
        run: ./scripts/package-release.sh "${{ steps.version.outputs.version }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/ROM Shelf.exe#ROM Shelf.exe" \
            "dist/ROM-Shelf-$RELEASE_VERSION-windows-x64.zip#Portable Windows bundle" \
            "dist/SHA256SUMS.txt#SHA-256 checksums" \
            --verify-tag \
            --title "ROM Shelf $RELEASE_TAG" \
            --generate-notes
