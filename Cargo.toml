[package]
name = "deck-shelf"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
description = "A fast, private, portable game-library catalogue"
license = "MIT"
repository = "https://github.com/xEnakil/DeckShelf"
build = "build.rs"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
open = "5.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tao = "0.36.0"
wry = "0.56.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
